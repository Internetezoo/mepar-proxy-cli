<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MePAR Térkép Megjelenítő</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #map {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Térkép inicializálása Magyarország közepére
        const map = L.map('map').setView([47.1625, 19.5033], 8);

        // OpenStreetMap háttérréteg
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // MePAR Topo10 réteg (a saját Vercel backend /api/tiles végpontodon keresztül)
        const meparTopo = L.tileLayer('/api/tiles?LAYER=iier:topo10&TileMatrixSet=EPSG:3857&TileMatrix=EPSG:3857:{z}&TileRow={y}&TileCol={x}', {
            maxZoom: 19,
            tileSize: 256,
            attribution: '&copy; MePAR / Magyar Államkincstár'
        }).addTo(map);

        // MePAR Fizikai Blokkok réteg
        const meparBlokkok = L.tileLayer('/api/tiles?LAYER=iier:fizikai_blokk&TileMatrixSet=EPSG:3857&TileMatrix=EPSG:3857:{z}&TileRow={y}&TileCol={x}', {
            maxZoom: 19,
            tileSize: 256,
            transparent: true
        });

        // Rétegválasztó doboz a térkép jobb felső sarkában
        const baseMaps = {
            "OpenStreetMap": osm
        };

        const overlayMaps = {
            "MePAR Topo10": meparTopo,
            "MePAR Fizikai Blokkok": meparBlokkok
        };

        L.control.layers(baseMaps, overlayMaps).addTo(map);
    </script>
</body>
</html>
